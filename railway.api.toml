# Railway deployment configuration for nexus-api service

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.prod"

[deploy]
startCommand = "/bin/sh -c 'python -m nexus.api --host 0.0.0.0 --port $PORT'"
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3